[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sgr-click"
version = "1.1.0"
description = "Semantic granularity recovery for interactive image segmentation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY.md", "licenses/*.txt"]
dependencies = [
    "torch>=2.7", "torchvision>=0.22", "numpy>=1.24,<2",
    "scipy>=1.10", "opencv-python>=4.8,<4.12", "Pillow>=10",
    "scikit-learn>=1.3", "scikit-image>=0.21",
    "timm==0.6.11", "einops>=0.6", "easydict>=1.9", "PyYAML>=6",
    "albumentations==0.5.2", "mmcv==1.6.2",
    "tqdm>=4.65", "pycocotools>=2.0.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build"]

[project.scripts]
sgr-click = "sgr_click.cli:main"
sgr-evaluate = "sgr_click.evaluation.cli:main"
sgr-summarize = "sgr_click.evaluation.summarize:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sgr_click.evaluation" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
